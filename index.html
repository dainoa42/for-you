<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Did You Wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#170b12;--bg2:#21101a;--ink:#fff0f5;--soft:#e3c3d1;--blush:#ffb3c8;--rose:#ff6f9c;--gold:#ffd98a;--leaf:#4f8a64;--line:rgba(255,179,200,.16)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
a{color:inherit}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:start center;overflow:hidden;
  background:radial-gradient(120% 75% at 50% 100%,#3a1428 0%,var(--bg) 62%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.title{position:relative;z-index:2;text-align:center;padding:clamp(56px,11vh,120px) 20px 0;opacity:0;animation:fade 2s 1.2s ease forwards}
.title p{margin:0;color:var(--soft);font-size:16px;letter-spacing:.02em}
.title h1{margin:.2em 0 .25em;font-size:clamp(44px,8vw,84px);line-height:1.02;font-style:italic;text-wrap:balance}
.open{display:inline-flex;align-items:center;gap:10px;margin-top:10px;min-height:48px;padding:0 24px;border-radius:999px;
  border:1px solid rgba(255,143,171,.6);color:var(--blush);text-decoration:none;font-weight:600;font-size:16px;
  background:rgba(255,143,171,.08);transition:background .3s}
.open:hover,.open:focus-visible{background:rgba(255,143,171,.2);outline:none}

.stem{fill:none;stroke:var(--leaf);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 2.4s cubic-bezier(.4,.1,.2,1) forwards}
.leaf{fill:var(--leaf);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop 1s ease-out forwards}
.bloom{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);animation:bloom 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
.petal{opacity:.92}
.fly{fill:var(--gold);opacity:0;animation:fly 6s ease-in-out infinite}

@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes bloom{to{transform:scale(1) rotate(0)}}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
@keyframes fade{to{opacity:1}}
@keyframes fly{0%,100%{opacity:0;transform:translate(0,0)}30%{opacity:.9}60%{opacity:.4;transform:translate(14px,-30px)}}

/* gate */
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;
  background:radial-gradient(80% 60% at 50% 55%,#3a1428 0%,#170b12 70%);transition:opacity 1.2s ease,visibility 1.2s}
.gate.gone{opacity:0;visibility:hidden}
.gate p{margin:0;color:var(--soft);font-size:16px}
.gate h2{margin:.35em 0 .5em;font-size:clamp(38px,7vw,64px);line-height:1.05;font-style:italic}
.bud{width:120px;height:150px;margin:0 auto 18px;animation:pulse 2.4s ease-in-out infinite}
.gate .tap{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,143,171,.6);color:var(--blush);font-weight:600;background:rgba(255,143,171,.08);font:600 16px "Nunito Sans",sans-serif}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
body.closed .stem,body.closed .leaf,body.closed .bloom,body.closed .title,body.closed .fly{animation-play-state:paused}
body.closed{overflow:hidden}
.drake{max-width:760px;margin:clamp(64px,9vw,110px) auto 0;padding:28px clamp(20px,4vw,36px);border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,111,156,.14),rgba(255,111,156,.03))}
.drake small{color:var(--soft);font-size:14px}
.drake h2{margin:.15em 0 .4em;font-size:clamp(30px,4.4vw,40px);font-style:italic;line-height:1.05}
.drake li{opacity:1;transform:none;border-top:0;padding:0}
.drake li+li{margin-top:20px}

/* note */
.band{padding:clamp(56px,9vw,110px) max(6vw,20px)}
.note{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.note .wrap{max-width:640px;margin:0 auto}
.note h2{font-size:clamp(34px,5vw,48px);line-height:1.05;font-style:italic;margin:0 0 .6em}
.note p{margin:0 0 1.1em;color:var(--ink)}
.note .sign{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;color:var(--blush);margin-top:1.4em}

/* parts */
.part{max-width:760px;margin:0 auto}
.part+.part{margin-top:clamp(64px,9vw,110px)}
.head{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.head svg{width:64px;height:64px;flex:none}
.head .bloom{animation:none}
.part.seen .head .bloom{animation:bloom 1.6s cubic-bezier(.2,.8,.2,1) forwards}
.head small{display:block;color:var(--soft);font-size:14px}
.head h2{margin:0;font-size:clamp(32px,4.6vw,44px);line-height:1.05;font-style:italic}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line);
  opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
.part.seen li{opacity:1;transform:none}
li .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;color:var(--rose);font-style:italic}
li .t{font-weight:600;font-size:17px}
li .a{color:var(--soft);font-weight:400}
li .why{grid-column:2/4;color:var(--soft);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:20px;line-height:1.35}
li .play{font-size:14px;color:var(--blush);text-decoration:none;white-space:nowrap;padding:6px 0;min-height:32px}
li .play:hover,li .play:focus-visible{text-decoration:underline;outline:none}

footer{text-align:center;padding:clamp(70px,10vw,120px) 20px 90px}
footer h2{font-size:clamp(36px,6vw,60px);font-style:italic;margin:0 0 .2em;line-height:1.05}
footer
